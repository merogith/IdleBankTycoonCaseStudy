name: Check economy model artifacts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 pypdf==6.21.4
      - run: python scripts/verify_model.py
